name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: Positioning lint
        run: pnpm lint:positioning

      - name: Build
        env:
          NEXT_PUBLIC_POLYGUARD_API_SERVER: api.polyguard.ai
          NEXT_PUBLIC_TRUST_CHECK_SCRIPT_URL: https://cdn.polyguard.ai/sdk/latest/trust-check.js
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke test
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  wordpress-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/wordpress
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - run: composer install --no-interaction --no-progress

      - name: phpcs (WordPress Coding Standards)
        run: composer lint

      - name: PHP syntax, lowest supported version
        run: |
          docker run --rm -v "$PWD/postcaptcha":/src -w /src php:7.4-cli \
            sh -c 'find . -name "*.php" -print0 | xargs -0 -n1 php -l'
